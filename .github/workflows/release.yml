# Builds the Windows and macOS installers and attaches them to a GitHub release.
# Start it by pushing a version tag:  git tag v0.1.0 && git push origin v0.1.0
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Build and publish installers
        # Publishes straight to the release of the pushed tag instead of a draft.
        run: npx electron-builder --publish always -c.publish.provider=github -c.publish.releaseType=release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No Apple developer certificate: package.json asks for an ad-hoc signature instead.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
